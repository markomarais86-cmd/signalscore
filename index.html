    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-32x32.png">

    <link rel="shortcut icon" href="/favicon.svg">
    
    <!-- LaunchPulse Brand Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="author" content="LaunchPulse" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LaunchPulse",
      "url": "https://launchpulse.io",
      "logo": "https://launchpulse.io/favicon.svg",

      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@launchpulse.io",
        "contactType": "sales"
      },
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LaunchPulse",
      "url": "https://launchpulse.io"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LaunchPulse",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-Driven ICP and TAM Intelligence Platform. Transform your go-to-market strategy with precision targeting and lead scoring.",
      "offers": {
        "@type": "Offer",
        "category": "SaaS"
      }
    }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://launchpulse.io/" />
    
    
    <meta property="og:image" content="https://launchpulse.io/og/og-landing.png">

    <meta name="twitter:image" content="https://launchpulse.io/og/og-landing.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://launchpulse.io/" />
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { anonymize_ip: true });
    </script>
  
  
  
  <meta property="og:title" content="LaunchPulse">
